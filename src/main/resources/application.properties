spring.application.name=agendamento-conversa
server.port=${HTTP_PORT:8080}
# Central de administracao em /admin: um login para curadoria, tabela de precos e simulador.
# ADMIN_USER/ADMIN_PASSWORD acessam tudo; CURADORIA_* e PRECOS_* (opcionais) acessam so a propria tela.
# Sem nenhuma credencial preenchida, as telas respondem 503.
admin.user=${ADMIN_USER:}
admin.password=${ADMIN_PASSWORD:}
admin.nome=${ADMIN_NOME:BioSa\u00fade}
# Endereco publico do Chatwoot: logo da marca e link "Conversas" no menu.
admin.chatwoot-url=${ADMIN_CHATWOOT_URL:${PRECOS_CHATWOOT_URL:https://bs-chat.jscinfor.com}}
# Sessao do login da central. Secure exige HTTPS (o proxy do Coolify); em http local use SESSAO_COOKIE_SECURE=false.
server.servlet.session.cookie.name=mandalore_sessao
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSAO_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie

# Credenciais somente por variavel de ambiente.

chatwoot.base-url=${CHATWOOT_BASE_URL:}
chatwoot.api-token=${CHATWOOT_API_TOKEN:}
chatwoot.webhook-secret=${CHATWOOT_WEBHOOK_SECRET:}
chatwoot.publish-timeout-ms=5000
chatwoot.account-id=${CHATWOOT_ACCOUNT_ID:}
chatwoot.website-token=${CHATWOOT_WEBSITE_TOKEN:}
# ID da equipe (Configuracoes > Equipes, numero na URL) que recebe o transbordo por assunto.
# Vazio: a conversa abre sem equipe.
chatwoot.equipes.recepcao=${CHATWOOT_EQUIPE_RECEPCAO:}
chatwoot.equipes.laboratorio=${CHATWOOT_EQUIPE_LABORATORIO:}
chatwoot.equipes.faturamento=${CHATWOOT_EQUIPE_FATURAMENTO:}

# Um hospital por conta do Chatwoot. Cada conta pode ter token, segredo e Oracle proprios:
#   mandalore.clientes.<account_id>.chatwoot-token=
#   mandalore.clientes.<account_id>.webhook-secret=
#   mandalore.clientes.<account_id>.tasy.url=
#   mandalore.clientes.<account_id>.tasy.username=
#   mandalore.clientes.<account_id>.tasy.password=
#   mandalore.clientes.<account_id>.agenda=mandalore|tasy
#   mandalore.clientes.<account_id>.recepcao.usuario= / .recepcao.senha=
# Conta sem cadastro usa os valores chatwoot.* e tasy.datasource.* deste arquivo.
# O arquivo fica fora do repositorio, com as credenciais.
# Perguntas frequentes (endereco, horario, convenios...): mandalore.faq.<tema> e, por conta,
# mandalore.clientes.<account_id>.faq.<tema>. Modelo em deploy/faq.exemplo.yaml.
spring.config.import=optional:file:${CLIENTES_PROPERTIES_FILE:./clientes.properties},optional:file:${FAQ_FILE:./faq.yaml}

# Simulador web em /simulador: conversa com o agente sem WhatsApp nem Chatwoot.
# No modo "via Chatwoot" usa a API publica do widget (CHATWOOT_WEBSITE_TOKEN) e
# segue o caminho real, inclusive o transbordo.
# Protegido pelo login da central (so ADMIN_USER). Gera conversas reais no Chatwoot; ligue so para testes.
simulador.enabled=${SIMULADOR_ENABLED:false}
# Foto ou PDF do pedido enviado pelo simulador (o Chatwoot aceita ate 10 MB por anexo).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Twilio WhatsApp. No Sandbox, use whatsapp:+14155238886.
# Em producao, altere somente TWILIO_WHATSAPP_FROM e as URLs publicas.
twilio.enabled=${TWILIO_ENABLED:false}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.webhook-url=${TWILIO_WEBHOOK_URL:}
twilio.status-callback-url=${TWILIO_STATUS_CALLBACK_URL:}

# Trilha operacional append-only. Em producao, use um PostgreSQL separado do Tasy.
observability.postgres.enabled=${OBSERVABILITY_POSTGRES_ENABLED:false}
observability.postgres.initialize-schema=${OBSERVABILITY_POSTGRES_INITIALIZE_SCHEMA:false}
observability.datasource.url=${OBSERVABILITY_POSTGRES_JDBC_URL:}
observability.datasource.username=${OBSERVABILITY_POSTGRES_USER:}
observability.datasource.password=${OBSERVABILITY_POSTGRES_PASSWORD:}
observability.datasource.hikari.maximum-pool-size=2
observability.datasource.hikari.minimum-idle=0
observability.datasource.hikari.connection-timeout=1000
# Curadoria: guarda a fala do paciente com CPF, datas, telefone, e-mail e números longos mascarados.
observability.curadoria.texto=${OBSERVABILITY_CURADORIA_TEXTO:true}
# Tela de curadoria em /curadoria (login da central). Requer a observabilidade no PostgreSQL.
# Para ensinar frases, a conta de serviço do Dialogflow precisa do papel "Dialogflow API Admin".
curadoria.enabled=${CURADORIA_ENABLED:false}
curadoria.user=${CURADORIA_USER:}
curadoria.password=${CURADORIA_PASSWORD:}
curadoria.limite-confianca=${CURADORIA_LIMITE_CONFIANCA:0.6}

# Relatorios: resumo da curadoria (diario) e relatorio do gestor (semanal). So numeros, sem fala de paciente.
# Requer a observabilidade no PostgreSQL. O OpenClaw le em /openclaw/** com OPENCLAW_TOKEN e envia ao Telegram.
relatorios.enabled=${RELATORIOS_ENABLED:false}
openclaw.token=${OPENCLAW_TOKEN:}
# Envio direto pelo Telegram do Mandalore, sem o OpenClaw. Cron do Spring; "-" desliga um deles.
relatorios.telegram.enabled=${RELATORIOS_TELEGRAM_ENABLED:false}
relatorios.telegram.token=${TELEGRAM_BOT_TOKEN:}
relatorios.telegram.chat-id=${TELEGRAM_CHAT_ID:}
relatorios.curadoria.cron=${RELATORIO_CURADORIA_CRON:0 0 8 * * *}
relatorios.gestor.cron=${RELATORIO_GESTOR_CRON:0 0 8 * * MON}
# Endereco publico do Mandalore, para o link da curadoria no resumo. Vazio: sem link.
relatorios.url=${RELATORIOS_URL:}

# Orcamento por foto do pedido medico: o Gemini (Vertex AI) le os exames, o Mandalore casa com a
# tabela de precos (orcamento.item_preco) e deixa uma nota privada para o Faturamento conferir.
# Requer a observabilidade no PostgreSQL. O financeiro mantem a tabela na tela /precos.
# A conta de servico do DIALOGFLOW_CREDENTIALS precisa do papel "Vertex AI User".
orcamento.enabled=${ORCAMENTO_ENABLED:false}
precos.user=${PRECOS_USER:}
precos.password=${PRECOS_PASSWORD:}
orcamento.gemini.project-id=${GEMINI_PROJECT_ID:${DIALOGFLOW_PROJECT_ID:}}
orcamento.gemini.location=${GEMINI_LOCATION:global}
orcamento.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Agenda do Mandalore (tela /agenda) para clinicas sem integracao com o sistema delas. Requer o PostgreSQL.
# Cada marcacao, cancelamento ou remarcacao vira uma pendencia para a recepcao repetir no sistema da clinica.
# agenda.origem: "mandalore" (o bot usa esta agenda) ou "tasy". Por conta: mandalore.clientes.<id>.agenda=mandalore.
# Login da recepcao de cada clinica: mandalore.clientes.<id>.recepcao.usuario/.senha (so a agenda da propria conta).
agenda.enabled=${AGENDA_ENABLED:false}
agenda.origem=${AGENDA_ORIGEM:tasy}
agenda.conta-padrao=${AGENDA_CONTA_PADRAO:${CHATWOOT_ACCOUNT_ID:1}}
agenda.user=${AGENDA_USER:}
agenda.password=${AGENDA_PASSWORD:}
# Minutos para a recepcao lancar no sistema da clinica antes de a pendencia ficar atrasada.
agenda.prazo-minutos=${AGENDA_PRAZO_MINUTOS:30}
# O bot so oferece horarios a partir de agora + antecedencia.
agenda.antecedencia-minutos=${AGENDA_ANTECEDENCIA_MINUTOS:60}
# Confirmacao pelo bot tambem vira pendencia (para clinicas que registram a confirmacao no sistema delas).
agenda.pendencia-confirmacao=${AGENDA_PENDENCIA_CONFIRMACAO:false}
# Endereco publico do Mandalore para o link da pendencia na nota do Chatwoot. Vazio: usa relatorios.url.
agenda.url=${AGENDA_URL:${RELATORIOS_URL:}}

# Dialogflow ES v2. Sessao <= 36 caracteres. Texto do detectIntent <= 256.
# Webhook de fulfillment: no maximo 5s e 64 KiB. Producao: HTTPS e um environment publicado.
# Cota de texto: 180 req/min no trial, 600 no Essentials. Um agente ES por regiao no projeto.
dialogflow.project-id=${DIALOGFLOW_PROJECT_ID:}
dialogflow.credentials=${DIALOGFLOW_CREDENTIALS:}
dialogflow.webhook-user=${DIALOGFLOW_WEBHOOK_USER:}
dialogflow.webhook-password=${DIALOGFLOW_WEBHOOK_PASSWORD:}
dialogflow.language-code=pt-BR
dialogflow.time-zone=America/Sao_Paulo
dialogflow.environment=${DIALOGFLOW_ENVIRONMENT:}
dialogflow.location=${DIALOGFLOW_LOCATION:}
dialogflow.detect-timeout-ms=8000

# Quem grava o agendamento: "tasy" (direto no Oracle do cliente) ou "agendamento-ds" (servico externo).
# "tasy" nao cria PESSOA_FISICA e cancela com IE_STATUS_AGENDA = 'C'. Valide em homologacao antes de ligar.
agendamento.escrita=${AGENDAMENTO_ESCRITA:agendamento-ds}
tasy.escrita.usuario=${TASY_ESCRITA_USUARIO:MANDALORE}

agendamento-ds.base-url=${AGENDAMENTO_DS_BASE_URL:http://localhost:7080}
agendamento-ds.connect-timeout-ms=1000
agendamento-ds.read-timeout-ms=3500

tasy.datasource.url=${ORACLE_JDBC_URL:}
tasy.datasource.username=${ORACLE_USER:}
tasy.datasource.password=${ORACLE_PASSWORD:}
tasy.datasource.driver-class-name=oracle.jdbc.OracleDriver
tasy.datasource.hikari.pool-name=agendamento-conversa
tasy.datasource.hikari.initialization-fail-timeout=-1
tasy.datasource.hikari.connection-timeout=3000
tasy.datasource.hikari.maximum-pool-size=5
tasy.datasource.hikari.minimum-idle=0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.br.com.mandalore.agendamentoconversa=INFO
