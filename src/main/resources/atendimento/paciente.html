<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Paciente</title>
  <link rel="stylesheet" href="/admin/assets/nav.css">
  <script src="/admin/assets/nav.js"></script>
  <style>
    :root {
      --fundo: #fdfdfd; --solido: #ffffff; --alpha-1: rgba(0, 0, 51, .03); --alpha-2: rgba(0, 0, 59, .055);
      --borda: #e8e8ec; --borda-forte: #d9d9e0;
      --texto: #1c2024; --texto-2: #60646c; --texto-3: #8b8d98;
      --marca: #0b5c7a; --marca-hover: #0a536e; --marca-suave: #e7eff2; --marca-texto: #094b64;
      --rubi: #e54666; --rubi-hover: #dc3b5d; --rubi-suave: #feeaed; --rubi-texto: #ca244d;
      --ambar-suave: #fff7c2; --ambar-texto: #ab6400;
      --verde: #30a46c; --verde-suave: #e6f6eb; --verde-texto: #218358;
      --violeta-suave: #f2effa; --violeta-texto: #5b4c9e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: flex; background: var(--fundo); color: var(--texto);
      font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; }

    main { flex: 1; min-width: 0; overflow-y: auto; }
    .conteudo { max-width: 1040px; margin: 0 auto; padding: 28px 28px 48px; }
    .cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: -.01em; }
    h2 { font-size: 15px; font-weight: 500; margin: 0; }
    .descricao { color: var(--texto-2); margin: 6px 0 0; max-width: 680px; }
    .botoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px;
      border: 0; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .12s; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.solido { background: var(--marca); color: #fff; }
    .btn.solido:hover:not(:disabled) { background: var(--marca-hover); }
    .btn.cinza { background: var(--alpha-2); color: var(--texto); }
    .btn.cinza:hover:not(:disabled) { background: rgba(0, 0, 59, .09); }

    .ferramentas { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 20px 0 14px; }
    input.campo, textarea.campo { height: 36px; width: 100%; padding: 0 12px; border-radius: 8px; border: 0; background: var(--alpha-1);
      outline: 1px solid var(--borda); font: inherit; font-size: 14px; color: var(--texto); }
    textarea.campo { height: 80px; padding: 8px 12px; resize: vertical; }
    .ferramentas #cpf { width: 220px; font-variant-numeric: tabular-nums; }
    input.campo:focus, textarea.campo:focus { outline: 1px solid var(--marca); background: var(--solido); }

    .cadastros { display: grid; gap: 6px; margin-bottom: 16px; }
    .cadastro { text-align: left; background: var(--alpha-1); border: 0; border-radius: 10px; padding: 10px 12px; font: inherit; cursor: pointer;
      color: var(--texto); display: flex; justify-content: space-between; gap: 12px; align-items: center; outline: 1px solid var(--borda); }
    .cadastro:hover, .cadastro.escolhido { background: var(--marca-suave); }

    .cartao { background: var(--solido); border-radius: 12px; padding: 14px 16px; box-shadow: 0 0 0 1px var(--borda), 0 1px 2px rgba(0,0,0,.03); }
    .resumo { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
    .monograma { width: 56px; height: 56px; border-radius: 14px; flex: none; display: grid; place-items: center; background: var(--marca-suave);
      color: var(--marca-texto); font-size: 20px; font-weight: 600; letter-spacing: .02em; }
    .resumo-dados { display: grid; gap: 6px; min-width: 0; }
    .resumo .nome { font-size: 18px; font-weight: 500; }
    .resumo .fatos { color: var(--texto-2); font-size: 13px; white-space: pre-wrap; }
    .indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .indicador { text-align: left; background: var(--alpha-1); border: 0; outline: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px;
      font: inherit; color: var(--texto-2); cursor: pointer; display: grid; gap: 2px; }
    .indicador:hover { background: var(--marca-suave); }
    .indicador b { font-size: 22px; font-weight: 500; color: var(--texto); font-variant-numeric: tabular-nums; line-height: 1.2; }
    .indicador.alerta b { color: var(--rubi-texto); }
    .indicador span { font-size: 12px; }
    .proximos { display: grid; gap: 6px; margin-bottom: 16px; padding: 12px 14px; border-radius: 12px; background: var(--marca-suave); }
    .proximos h2 { font-size: 13px; color: var(--marca-texto); }
    .proximo { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    .proximo .data { font-weight: 500; font-variant-numeric: tabular-nums; }
    .barra-abas { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px;
      border-bottom: 1px solid var(--borda); }
    .abas { display: flex; gap: 4px; flex-wrap: wrap; }
    .aba { border: 0; background: transparent; font: inherit; font-weight: 500; color: var(--texto-2); padding: 8px 10px; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .aba:hover { color: var(--texto); }
    .aba.ativa { color: var(--marca-texto); border-bottom-color: var(--marca); }
    .barra-abas #buscaHistorico { width: 240px; margin-bottom: 6px; }
    .tabela-agenda { background: var(--solido); border-radius: 12px; box-shadow: 0 0 0 1px var(--borda); overflow: hidden; }
    .linha-agenda { display: grid; grid-template-columns: 130px minmax(120px, 1fr) minmax(140px, 1.2fr) auto; gap: 12px; align-items: center;
      padding: 9px 14px; border-top: 1px solid var(--borda); font-size: 13px; }
    .linha-agenda:first-child, .filtro-ativo + .linha-agenda { border-top: 0; }
    .linha-agenda .data { font-weight: 500; font-variant-numeric: tabular-nums; }
    .filtro-ativo { display: flex; gap: 8px; align-items: center; padding: 8px 14px; background: var(--alpha-1); font-size: 13px; color: var(--texto-2); }
    .itens-receita { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
    .btn.mini { height: 26px; padding: 0 8px; font-size: 13px; border-radius: 6px; }
    .paciente .nome { font-size: 18px; font-weight: 500; }
    .sub { color: var(--texto-3); font-size: 12px; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { background: var(--alpha-2); color: var(--texto-2); border-radius: 6px; padding: 0 6px; font-size: 12px; line-height: 20px; white-space: nowrap; display: inline-block; }
    .tag.ambar { background: var(--ambar-suave); color: var(--ambar-texto); }
    .tag.verde { background: var(--verde-suave); color: var(--verde-texto); }
    .tag.rubi { background: var(--rubi-suave); color: var(--rubi-texto); }
    .tag.marca { background: var(--marca-suave); color: var(--marca-texto); }
    .tag.violeta { background: var(--violeta-suave); color: var(--violeta-texto); }

    .linha-tempo { display: grid; gap: 10px; }
    .visita { display: grid; gap: 8px; }
    .visita .topo { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
    .visita .data { font-weight: 500; font-variant-numeric: tabular-nums; }
    .eventos { display: grid; gap: 2px; border-left: 2px solid var(--borda); padding-left: 12px; margin: 2px 0 0 4px; }
    .evento { display: flex; gap: 10px; font-size: 13px; color: var(--texto-2); }
    .evento .quando { font-variant-numeric: tabular-nums; color: var(--texto-3); white-space: nowrap; min-width: 92px; }
    .evento.clinico { color: var(--marca-texto); }
    details.eventos-box summary { cursor: pointer; color: var(--marca); font-size: 12px; }

    .clinico-box { background: var(--alpha-1); outline: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
    .clinico-box .cid { font-weight: 500; color: var(--marca-texto); }
    .clinico-box p { margin: 0; white-space: pre-wrap; font-size: 13px; }
    .clinico-box .rotulo { font-weight: 600; }
    .clinico-box ul { margin: 0; padding-left: 18px; font-size: 13px; }
    .vazio { text-align: center; color: var(--texto-3); padding: 24px 8px; font-size: 13px; }

    dialog { border: 0; padding: 24px; border-radius: 12px; width: min(520px, calc(100vw - 32px)); color: var(--texto);
      box-shadow: 0 0 0 1px var(--borda), 0 16px 48px rgba(0, 0, 0, .14); background: var(--solido); }
    dialog::backdrop { background: rgba(0, 0, 0, .3); backdrop-filter: blur(2px); }
    dialog h2 { font-size: 16px; }
    dialog p.sub { color: var(--texto-2); margin: 4px 0 0; font-size: 14px; }
    [hidden] { display: none !important; }
    .form { display: grid; gap: 14px; margin-top: 18px; }
    .form label { display: grid; gap: 6px; font-weight: 500; }
    .form .dica { font-weight: 400; color: var(--texto-3); font-size: 12px; }
    .form .msg-erro { font-weight: 400; color: var(--rubi-texto); font-size: 13px; }
    .rodape { display: flex; gap: 12px; margin-top: 22px; }
    .rodape .btn { flex: 1; height: 36px; }

    #aviso { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); background: var(--texto); color: #fff;
      padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); opacity: 0; pointer-events: none;
      transition: opacity .15s, transform .15s; max-width: calc(100vw - 32px); display: flex; gap: 8px; align-items: center; z-index: 10; }
    #aviso.ver { opacity: 1; transform: translate(-50%, 0); }
    #aviso.erro::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rubi); flex: none; }

    @media (max-width: 860px) {
      .conteudo { padding: 20px 16px 40px; }
      .ferramentas #cpf { width: 100%; }
      .barra-abas #buscaHistorico { width: 100%; }
      .linha-agenda { grid-template-columns: 1fr auto; }
      .linha-agenda > :nth-child(2), .linha-agenda > :nth-child(3) { grid-column: 1; }
    }
  </style>
  <link rel="stylesheet" href="/admin/assets/tema.css">
</head>
<body>
  <main>
    <div class="conteudo">
      <div class="cabecalho">
        <div>
          <h1 id="titulo">Histórico do paciente</h1>
          <p class="descricao" id="descricao"></p>
        </div>
        <div class="botoes">
          <a class="btn cinza" id="voltar" href="/atendimento">Voltar</a>
        </div>
      </div>

      <form class="ferramentas" id="formCpf" novalidate>
        <input class="campo" id="cpf" inputmode="numeric" maxlength="14" placeholder="CPF do paciente" autocomplete="off">
        <button class="btn solido" type="submit" id="buscar">Consultar</button>
      </form>

      <div class="cadastros" id="cadastros"></div>
      <div id="resultado"></div>
    </div>
  </main>

  <dialog id="dlgMotivo">
    <form method="dialog" id="formMotivo" novalidate>
      <h2>Motivo do acesso</h2>
      <p class="sub" id="mTexto">Este paciente não está na sua agenda de hoje. O acesso ao prontuário fica registrado com o motivo,
        seu usuário, data e hora.</p>
      <div class="form">
        <label>Motivo <span class="dica">Ex.: paciente trouxe exame para avaliação; discussão do caso com o colega; retorno antecipado.</span>
          <textarea class="campo" id="mMotivo" maxlength="500"></textarea></label>
        <span class="msg-erro" id="mErro"></span>
      </div>
      <div class="rodape">
        <button class="btn cinza" type="button" data-fechar>Voltar</button>
        <button class="btn solido" type="submit" id="mOk">Abrir prontuário</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" role="status"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const MEDICO = location.pathname.startsWith("/consultorio");
    const BASE = MEDICO ? "/consultorio" : "/atendimento";
    const params = new URLSearchParams(location.search);
    const estado = { conta: params.get("conta"), pacienteId: null };

    const STATUS_AGENDA = {
      MARCADO: ["Marcado", ""], CONFIRMADO: ["Confirmado", "marca"], CANCELADO: ["Cancelado", "rubi"], FALTOU: ["Faltou", "rubi"],
      CHEGOU: ["Chegou", "ambar"], EM_CONSULTA: ["Em consulta", "violeta"], EXECUTADO: ["Atendido", "verde"], REMARCADO: ["Remarcado", ""]
    };
    const EVENTOS = {
      MARCADO: "Consulta marcada", LANCADO: "Lançada no sistema da clínica", CONFIRMADO: "Consulta confirmada",
      CANCELADO: "Consulta cancelada", REMARCADO_PARA: "Remarcada para", REMARCADO_DE: "Remarcada de", FALTOU: "Faltou", FALTA_DESFEITA: "Falta desfeita",
      CHEGADA: "Chegada registrada", CHEGADA_DESFEITA: "Chegada desfeita", CHAMADO: "Chamado para",
      CONSULTA_INICIADA: "Consulta iniciada", FINALIZADO: "Atendimento finalizado",
      ANAMNESE_SALVA: "Nota da consulta salva", ANAMNESE_LIBERADA: "Nota da consulta liberada",
      ANAMNESE_INATIVADA: "Nota da consulta inativada", ANAMNESE_DESCARTADA: "Rascunho da nota descartado",
      EVOLUCAO_SALVA: "Evolução salva", EVOLUCAO_LIBERADA: "Evolução liberada", EVOLUCAO_INATIVADA: "Evolução inativada",
      EVOLUCAO_DESCARTADA: "Rascunho de evolução descartado", DIAGNOSTICO_INCLUIDO: "Diagnóstico incluído",
      DIAGNOSTICO_INATIVADO: "Diagnóstico inativado", RECEITA_SALVA: "Receita salva", RECEITA_LIBERADA: "Receita liberada",
      RECEITA_CANCELADA: "Receita cancelada", RECEITA_DESCARTADA: "Rascunho de receita descartado",
      ALERGIA_INCLUIDA: "Alergia registrada", ALERGIA_INATIVADA: "Alergia inativada"
    };
    const CLINICOS = /^(ANAMNESE|EVOLUCAO|DIAGNOSTICO|RECEITA|ALERGIA)_/;
    const MOTIVO_ALTA = { ALTA_MEDICA: "alta médica", ENCAMINHADO: "encaminhado", DESISTENCIA: "desistência", OUTRO: "outro" };
    const DESFECHO = { ALTA: "Alta", RETORNO: "Retorno", ENCAMINHAMENTO: "Encaminhamento" };
    const STATUS_ATEND = { AGUARDANDO: "Aguardando", EM_CONSULTA: "Em consulta", FINALIZADO: "Finalizado", CANCELADO: "Cancelado" };

    function el(tag, attrs, ...filhos) {
      const node = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => node[k] = v);
      filhos.flat().forEach((f) => f !== null && f !== undefined && f !== false && f !== "" && node.append(f));
      return node;
    }

    function aviso(texto, erro) {
      const a = $("aviso");
      a.textContent = texto;
      a.className = "ver" + (erro ? " erro" : "");
      clearTimeout(aviso.t);
      aviso.t = setTimeout(() => a.className = erro ? "erro" : "", erro ? 6000 : 3500);
    }

    function url(caminho) {
      return estado.conta ? caminho + "?conta=" + encodeURIComponent(estado.conta) : caminho;
    }

    async function api(caminho, opcoes) {
      const resp = await fetch(url(caminho), opcoes);
      if (resp.status === 204) return null;
      const corpo = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(corpo.erro || ("Erro " + resp.status));
      return corpo;
    }

    const post = (caminho, corpo) => api(caminho, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(corpo || {}) });
    const vazio = (s) => s === null || s === undefined || String(s).trim() === "";
    const digitos = (s) => (s || "").replace(/\D/g, "");
    const semAcento = (s) => (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const fmtCpf = (c) => { const d = digitos(c); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4") : (c || ""); };
    const dataBr = (iso) => iso ? String(iso).substring(0, 10).split("-").reverse().join("/") : "";
    const dataHoraBr = (iso) => iso ? dataBr(iso) + " " + String(iso).substring(11, 16) : "";
    const fmtInstante = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const instanteBr = (iso) => iso ? fmtInstante.format(new Date(iso)).replace(",", "") : "";

    function idade(nascimento) {
      if (!nascimento) return "";
      const [a, m, d] = nascimento.split("-").map(Number);
      const hoje = new Date();
      let anos = hoje.getFullYear() - a;
      if (hoje.getMonth() + 1 < m || (hoje.getMonth() + 1 === m && hoje.getDate() < d)) anos--;
      return anos + (anos === 1 ? " ano" : " anos");
    }

    // ---------- Busca por CPF ----------
    async function buscar() {
      const cpf = digitos($("cpf").value);
      if (cpf.length !== 11) { aviso("Informe o CPF com 11 dígitos.", true); $("cpf").focus(); return; }
      $("buscar").disabled = true;
      $("cadastros").replaceChildren();
      $("resultado").replaceChildren();
      try {
        const lista = (await post(BASE + "/api/pacientes/cpf", { cpf })) || [];
        if (!lista.length) {
          $("resultado").replaceChildren(el("div", { className: "vazio" }, "Nenhum paciente com este CPF nesta clínica."));
          return;
        }
        const itens = lista.map((x) => MEDICO ? x : { paciente: x, exigeMotivo: false });
        if (itens.length === 1) { abrir(itens[0]); return; }
        $("cadastros").replaceChildren(el("p", { className: "sub", style: "margin:0" },
          "Há mais de um cadastro com este CPF (nascimentos diferentes). Escolha qual abrir."),
          ...itens.map((x) => el("button", { className: "cadastro", type: "button", onclick: (ev) => {
            document.querySelectorAll(".cadastro").forEach((b) => b.classList.remove("escolhido"));
            ev.currentTarget.classList.add("escolhido");
            abrir(x);
          } },
            el("span", {}, el("b", {}, x.paciente.nome), " ", el("span", { className: "sub" }, "nasc. " + dataBr(x.paciente.nascimento))),
            x.exigeMotivo ? el("span", { className: "tag ambar" }, "Fora da sua agenda de hoje") : null)));
      } catch (e) {
        aviso(e.message, true);
      } finally {
        $("buscar").disabled = false;
      }
    }

    function abrir(item) {
      estado.pacienteId = item.paciente.id;
      if (MEDICO && item.exigeMotivo) { pedirMotivo(item.paciente); return; }
      carregar(null);
    }

    function pedirMotivo(paciente) {
      $("mMotivo").value = "";
      $("mErro").textContent = "";
      $("mOk").disabled = false;
      if (paciente) $("mTexto").textContent = paciente.nome + " não está na sua agenda de hoje. O acesso ao prontuário fica registrado"
        + " com o motivo, seu usuário, data e hora.";
      $("dlgMotivo").showModal();
      $("mMotivo").focus();
    }

    async function carregar(motivo) {
      $("resultado").replaceChildren(el("div", { className: "vazio" }, "Carregando…"));
      try {
        const dados = MEDICO
          ? await post(BASE + "/api/pacientes/" + estado.pacienteId + "/prontuario", { motivo })
          : await api(BASE + "/api/pacientes/" + estado.pacienteId + "/ficha");
        desenhar(dados);
        return true;
      } catch (e) {
        if (MEDICO && motivo === null && /motivo/i.test(e.message)) {
          $("resultado").replaceChildren();
          pedirMotivo(null);
          return false;
        }
        $("resultado").replaceChildren();
        if (motivo !== null) throw e;
        aviso(e.message, true);
        return false;
      }
    }

    // ---------- Desenho ----------
    const futura = (v) => (v.statusAgendamento === "MARCADO" || v.statusAgendamento === "CONFIRMADO") && new Date(v.inicio) > new Date();
    const INDICADORES = [
      { id: "realizadas", titulo: "Consultas realizadas", filtro: (v) => v.statusAgendamento === "EXECUTADO" },
      { id: "proximas", titulo: "Próximas", filtro: futura },
      { id: "faltas", titulo: "Faltas", filtro: (v) => v.statusAgendamento === "FALTOU", alerta: true },
      { id: "cancelados", titulo: "Cancelados", filtro: (v) => v.statusAgendamento === "CANCELADO" }
    ];

    function desenhar(dados) {
      estado.dados = dados;
      estado.aba = "linha";
      estado.indicador = null;
      $("resultado").replaceChildren(resumo(dados), indicadores(dados), proximos(dados),
        el("div", { className: "barra-abas" },
          el("div", { className: "abas", role: "tablist" }, abasDisponiveis().map(([id, titulo]) =>
            el("button", { type: "button", className: "aba", role: "tab", onclick: () => trocarAba(id) }, titulo))),
          el("input", { className: "campo", type: "search", id: "buscaHistorico", placeholder: "Buscar no histórico", autocomplete: "off",
            oninput: filtrarHistorico })),
        el("div", { id: "conteudo" }));
      document.querySelectorAll(".aba").forEach((b, i) => b.dataset.aba = abasDisponiveis()[i][0]);
      trocarAba("linha");
    }

    function abasDisponiveis() {
      return MEDICO
        ? [["linha", "Linha do tempo"], ["consultas", "Consultas"], ["receitas", "Receitas"], ["agendamentos", "Agendamentos"]]
        : [["linha", "Linha do tempo"], ["agendamentos", "Agendamentos"]];
    }

    function iniciais(nome) {
      const partes = (nome || "").trim().split(/\s+/).filter((s) => s.length > 2 || /^[A-ZÁ-Ú]/.test(s));
      return ((partes[0] || "")[0] || "") + (partes.length > 1 ? partes[partes.length - 1][0] : "");
    }

    function resumo(dados) {
      const p = dados.paciente;
      const visitas = dados.visitas || [];
      const ultimaComConvenio = visitas.find((v) => v.convenio);
      const ultimoAtendido = visitas.find((v) => v.statusAgendamento === "EXECUTADO");
      const fatos = [p.nascimento ? idade(p.nascimento) + " · nasc. " + dataBr(p.nascimento) : "", "CPF " + fmtCpf(p.cpf),
        p.telefone ? "Tel. " + p.telefone : "", ultimaComConvenio ? ultimaComConvenio.convenio : "Particular"].filter(Boolean);
      const etiquetas = [];
      if (MEDICO) {
        const alergias = dados.alergias || [];
        if (alergias.length) alergias.forEach((a) => etiquetas.push(el("span", { className: "tag rubi",
          title: "Registrada por " + (a.usuario || "") + " em " + dataHoraBr(a.dtRegistro) }, "Alergia: " + a.descricao)));
        else etiquetas.push(el("span", { className: "tag" }, "Sem alergias registradas"));
        const cids = new Map();
        (dados.atendimentos || []).forEach((c) => (c.diagnosticos || []).forEach((d) => !cids.has(d.cid) && cids.set(d.cid, d.descricao)));
        [...cids].slice(0, 5).forEach(([cid, desc]) => etiquetas.push(el("span", { className: "tag marca", title: desc || "" }, cid)));
      }
      return el("section", { className: "cartao resumo" },
        el("div", { className: "monograma", ariaHidden: "true" }, iniciais(p.nome).toUpperCase()),
        el("div", { className: "resumo-dados" },
          el("span", { className: "nome" }, p.nome),
          el("span", { className: "fatos" }, fatos.join("  ·  ")),
          etiquetas.length ? el("div", { className: "tags" }, etiquetas) : null,
          el("span", { className: "sub" }, ultimoAtendido
            ? "Último atendimento em " + dataBr(ultimoAtendido.inicio) + " com " + (ultimoAtendido.profissional || "")
            : "Ainda sem atendimento realizado na clínica")));
    }

    function indicadores(dados) {
      const visitas = dados.visitas || [];
      const itens = INDICADORES.map((ind) => {
        const total = visitas.filter(ind.filtro).length;
        return el("button", { type: "button", className: "indicador" + (ind.alerta && total ? " alerta" : ""),
          title: "Ver em Agendamentos", onclick: () => { estado.indicador = ind.id; trocarAba("agendamentos"); } },
          el("b", {}, String(total)), el("span", {}, ind.titulo));
      });
      if (MEDICO) {
        const receitas = (dados.atendimentos || []).reduce((n, c) => n + (c.receitas || []).length, 0);
        itens.push(el("button", { type: "button", className: "indicador", title: "Ver receitas", onclick: () => trocarAba("receitas") },
          el("b", {}, String(receitas)), el("span", {}, "Receitas")));
      }
      return el("div", { className: "indicadores" }, itens);
    }

    function proximos(dados) {
      const lista = (dados.visitas || []).filter(futura).sort((a, b) => a.inicio.localeCompare(b.inicio));
      if (!lista.length) return null;
      return el("section", { className: "proximos" }, el("h2", {}, "Próximos agendamentos"),
        ...lista.slice(0, 3).map((v) => el("div", { className: "proximo" },
          el("span", { className: "data" }, dataHoraBr(v.inicio)),
          el("span", {}, [v.especialidade, v.profissional].filter(Boolean).join(" com ")),
          el("span", { className: "tag" + (v.statusAgendamento === "CONFIRMADO" ? " marca" : "") },
            v.statusAgendamento === "CONFIRMADO" ? "Confirmada" : "Marcada"))));
    }

    function trocarAba(id) {
      estado.aba = id;
      document.querySelectorAll(".aba").forEach((b) => {
        b.classList.toggle("ativa", b.dataset.aba === id);
        b.ariaSelected = String(b.dataset.aba === id);
      });
      const dados = estado.dados;
      const consultas = new Map((dados.atendimentos || []).map((c) => [c.atendimento.nrAtendimento, c]));
      let itens;
      if (id === "consultas") {
        itens = (dados.atendimentos || []).map((c) => el("div", { className: "cartao visita" },
          el("div", { className: "topo" }, el("span", { className: "data" }, dataHoraBr(c.atendimento.dtEntrada)),
            el("span", { className: "sub" }, c.atendimento.especialidade || "")), blocoClinico(c)));
      } else if (id === "receitas") {
        itens = (dados.atendimentos || []).flatMap((c) => (c.receitas || []).map((r) => ({ c, r })))
          .sort((a, b) => String(b.r.dtLiberacao).localeCompare(String(a.r.dtLiberacao)))
          .map(({ c, r }) => el("div", { className: "cartao visita" },
            el("div", { className: "topo" }, el("span", { className: "data" }, dataBr(r.dtLiberacao)),
              el("span", { className: "sub" }, [c.atendimento.profissional, r.tipo === "ESPECIAL" ? "controle especial" : ""].filter(Boolean).join(" · "))),
            el("ul", { className: "itens-receita" }, (r.itens || []).map((i) => el("li", {},
              el("b", {}, [i.medicamento, i.apresentacao].filter(Boolean).join(" ")), i.posologia ? " — " + i.posologia : "",
              i.usoContinuo ? el("span", { className: "tag verde", style: "margin-left:6px" }, "uso contínuo") : null)))));
      } else if (id === "agendamentos") {
        const ind = INDICADORES.find((x) => x.id === estado.indicador);
        const visitas = (dados.visitas || []).filter((v) => !ind || ind.filtro(v));
        const filtroAtivo = ind ? el("div", { className: "filtro-ativo" }, "Mostrando: " + ind.titulo + " ",
          el("button", { type: "button", className: "btn cinza mini", onclick: () => { estado.indicador = null; trocarAba("agendamentos"); } }, "Ver todos")) : null;
        itens = [filtroAtivo, ...visitas.map((v) => {
          const [rotulo, cor] = STATUS_AGENDA[v.statusAgendamento] || [v.statusAgendamento || "", ""];
          return el("div", { className: "linha-agenda" },
            el("span", { className: "data" }, dataHoraBr(v.inicio)),
            el("span", {}, v.profissional || ""),
            el("span", { className: "sub" }, [v.especialidade, v.convenio || "Particular"].filter(Boolean).join(" · ")),
            el("span", { className: "tag " + cor }, rotulo));
        })].filter(Boolean);
        if (!visitas.length) itens.push(el("div", { className: "vazio" }, "Nenhum agendamento nesta situação."));
      } else {
        const usados = new Set();
        itens = (dados.visitas || []).map((v) => {
          const consulta = v.nrAtendimento ? consultas.get(v.nrAtendimento) : null;
          if (consulta) usados.add(v.nrAtendimento);
          return cartaoVisita(v, consulta);
        });
        [...consultas.values()].filter((c) => !usados.has(c.atendimento.nrAtendimento))
          .forEach((c) => itens.push(el("div", { className: "cartao visita" },
            el("div", { className: "topo" }, el("span", { className: "data" }, dataHoraBr(c.atendimento.dtEntrada)),
              el("span", { className: "sub" }, c.atendimento.profissional || "")), blocoClinico(c))));
      }
      const vazio = { consultas: "Nenhuma consulta com registro liberado.", receitas: "Nenhuma receita liberada.", linha: "Nenhum agendamento registrado." };
      $("conteudo").replaceChildren(el("div", { className: id === "agendamentos" ? "tabela-agenda" : "linha-tempo" },
        itens.length ? itens : el("div", { className: "vazio" }, vazio[id] || "")));
      filtrarHistorico();
    }

    function filtrarHistorico() {
      const termo = semAcento($("buscaHistorico")?.value || "").trim();
      document.querySelectorAll("#conteudo .cartao, #conteudo .linha-agenda").forEach((n) => {
        n.hidden = !!termo && !semAcento(n.textContent).includes(termo);
      });
    }

    function cartaoVisita(v, consulta) {
      const [rotulo, cor] = STATUS_AGENDA[v.statusAgendamento] || [v.statusAgendamento || "", ""];
      const eventos = (v.eventos || []).map((e) => {
        const clinico = CLINICOS.test(e.tipo);
        let texto = EVENTOS[e.tipo] || e.tipo.replace(/_/g, " ").toLowerCase();
        if (!clinico && !vazio(e.detalhe)) {
          texto += e.tipo === "FINALIZADO" ? " (" + (MOTIVO_ALTA[e.detalhe] || e.detalhe) + ")" : (/ (para|de)$/.test(texto) ? " " : ": ") + e.detalhe;
        }
        return el("div", { className: "evento" + (clinico ? " clinico" : "") },
          el("span", { className: "quando" }, instanteBr(e.em)), el("span", {}, texto + (e.usuario ? " · " + e.usuario : "")));
      });
      return el("div", { className: "cartao visita" },
        el("div", { className: "topo" },
          el("span", {}, el("span", { className: "data" }, dataHoraBr(v.inicio)), " ",
            el("span", { className: "tag " + cor }, rotulo)),
          el("span", { className: "sub" }, [v.profissional, v.especialidade, v.convenio || "Particular"].filter(Boolean).join(" · "))),
        el("div", { className: "tags" },
          v.nrAtendimento ? el("span", { className: "tag marca" }, "Atendimento nº " + v.nrAtendimento
            + (v.statusAtendimento ? " · " + (STATUS_ATEND[v.statusAtendimento] || v.statusAtendimento) : "")) : null,
          v.localChamada ? el("span", { className: "tag violeta" }, "Chamado para " + v.localChamada) : null,
          v.origem ? el("span", { className: "tag" }, "Origem: " + v.origem) : null),
        consulta ? blocoClinico(consulta) : null,
        eventos.length ? el("details", { className: "eventos-box", open: !MEDICO },
          el("summary", {}, "Histórico (" + eventos.length + ")"), el("div", { className: "eventos" }, eventos)) : null);
    }

    function blocoClinico(c) {
      const a = c.anamnese || {};
      const partes = [];
      (c.diagnosticos || []).forEach((d) => partes.push(el("span", { className: "cid" },
        (d.tipo === "SECUNDARIO" ? "Secundário: " : "") + d.cid + (d.descricao ? " · " + d.descricao : ""))));
      [["Queixa", a.queixaPrincipal], ["História", a.historiaDoencaAtual], ["Antecedentes pessoais", a.antecedentesPessoais],
        ["Antecedentes familiares", a.antecedentesFamiliares], ["Medicamentos em uso", a.medicamentosEmUso], ["Hábitos", a.habitos],
        ["Exame físico", a.exameFisico], ["Avaliação", a.avaliacao], ["Conduta", a.conduta]]
        .filter(([, v]) => !vazio(v))
        .forEach(([r, v]) => partes.push(el("p", {}, el("span", { className: "rotulo" }, r + ": "), v)));
      (c.evolucoes || []).forEach((e) => partes.push(el("p", {}, el("span", { className: "rotulo" }, "Evolução " + dataHoraBr(e.dtEvolucao) + ": "), e.texto)));
      (c.receitas || []).forEach((r) => partes.push(el("div", {},
        el("span", { className: "rotulo" }, "Receita" + (r.tipo === "ESPECIAL" ? " (controle especial)" : "") + " · " + dataBr(r.dtLiberacao)),
        el("ul", {}, (r.itens || []).map((i) => el("li", {},
          [i.medicamento, i.apresentacao].filter(Boolean).join(" "), i.posologia ? " — " + i.posologia : ""))))));
      if (c.alta) {
        partes.push(el("p", {}, el("span", { className: "rotulo" }, (DESFECHO[c.alta.desfecho] || c.alta.desfecho || "Alta") + ": "),
          [c.alta.orientacao, c.alta.retornoPrevisto ? "retorno previsto em " + dataBr(c.alta.retornoPrevisto) : ""].filter(Boolean).join(" · ") || "sem orientação"));
      }
      const autor = el("span", { className: "sub" }, "Atendido por " + (c.atendimento.profissional || "") + (c.atendimento.especialidade ? " · " + c.atendimento.especialidade : ""));
      return el("div", { className: "clinico-box" }, autor,
        partes.length ? partes : el("span", { className: "sub" }, "Sem registro clínico liberado neste atendimento."));
    }

    // ---------- Eventos da tela ----------
    $("formCpf").addEventListener("submit", (ev) => { ev.preventDefault(); buscar(); });
    $("cpf").addEventListener("input", () => {
      const d = digitos($("cpf").value).substring(0, 11);
      $("cpf").value = d.replace(/^(\d{3})(\d)/, "$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
        .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, "$1.$2.$3-$4");
    });
    document.querySelectorAll("[data-fechar]").forEach((b) => b.addEventListener("click", () => b.closest("dialog").close()));
    $("formMotivo").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const motivo = $("mMotivo").value.trim();
      if (motivo.length < 5) { $("mErro").textContent = "Descreva o motivo (pelo menos 5 letras)."; return; }
      $("mOk").disabled = true;
      try {
        await carregar(motivo);
        $("dlgMotivo").close();
      } catch (e) {
        $("mErro").textContent = e.message;
      } finally {
        $("mOk").disabled = false;
      }
    });

    (() => {
      document.title = MEDICO ? "Prontuário do paciente" : "Histórico do paciente";
      $("titulo").textContent = document.title;
      $("descricao").textContent = MEDICO
        ? "Consulte pelo CPF todo o histórico do paciente na clínica: agendamentos, chegadas, chamadas e as consultas liberadas por"
          + " todos os médicos. Paciente fora da sua agenda de hoje pede o motivo do acesso, que fica registrado."
        : "Consulte pelo CPF os agendamentos, chegadas, chamadas e faltas do paciente, e quem atendeu. Sem conteúdo clínico.";
      $("voltar").href = BASE + (estado.conta ? "?conta=" + encodeURIComponent(estado.conta) : "");
      const id = Number(params.get("paciente"));
      if (id > 0) {
        estado.pacienteId = id;
        carregar(null);
      } else {
        $("cpf").focus();
      }
    })();
  </script>
</body>
</html>
