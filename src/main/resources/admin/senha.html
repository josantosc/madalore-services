<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trocar senha - Central de administração</title>
  <link rel="icon" href="__CHATWOOT_URL__/favicon-32x32.png">
  <style>
    :root { --bs-primary: #0b5c7a; --bs-glow: #12a4a8; --bs-accent: #e53935; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; color: #e6f4f8;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 32px 16px;
      background:
        radial-gradient(60rem 40rem at 10% -10%, color-mix(in srgb, var(--bs-primary) 55%, transparent), transparent 60%),
        radial-gradient(50rem 35rem at 110% 110%, color-mix(in srgb, var(--bs-accent) 30%, transparent), transparent 60%),
        linear-gradient(160deg, #04101a 0%, #0a1f2b 55%, #050d15 100%);
    }
    header { text-align: center; display: grid; justify-items: center; gap: 12px; }
    header img { height: 52px; }
    h1 { margin: 0; font-size: 26px; line-height: 32px; font-weight: 600;
      background: linear-gradient(90deg, #ffffff, var(--bs-glow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    header p { margin: -6px 0 0; color: rgba(230, 244, 248, .6); font-size: 14px; max-width: 408px; }
    .cartao {
      width: min(408px, 100%); padding: 32px 34px 28px; border-radius: 22px;
      background: rgba(8, 24, 34, .55); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7), 0 0 60px -10px color-mix(in srgb, var(--bs-primary) 55%, transparent);
    }
    form { display: grid; gap: 18px; }
    label { display: grid; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(230, 244, 248, .85); }
    input {
      height: 44px; padding: 0 14px; font: inherit; font-size: 14px; color: #e6f4f8; caret-color: var(--bs-glow);
      background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; outline: none;
    }
    input:focus { background: rgba(255, 255, 255, .07); border-color: var(--bs-glow);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--bs-glow) 30%, transparent); }
    .dica { margin: -10px 0 0; font-size: 12px; color: rgba(230, 244, 248, .5); }
    button {
      height: 44px; margin-top: 4px; border: 0; border-radius: 12px; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 600; letter-spacing: .03em; color: #fff;
      background: linear-gradient(110deg, var(--bs-primary), var(--bs-glow) 50%, var(--bs-primary)); background-size: 200% 100%;
    }
    button:disabled { opacity: .7; cursor: wait; }
    .mensagem { display: none; margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
    .mensagem.erro { display: block; background: rgba(229, 57, 53, .14); border: 1px solid rgba(229, 57, 53, .35); color: #ffb4b0; }
    .mensagem.info { display: block; background: rgba(18, 164, 168, .12); border: 1px solid rgba(18, 164, 168, .35); color: #a8e6e8; }
    .rodape { margin: 22px 0 0; text-align: center; font-size: 12px; color: rgba(230, 244, 248, .45); }
    .rodape a, .rodape button { color: var(--bs-glow); text-decoration: none; background: none; height: auto; margin: 0; padding: 0;
      font-size: 12px; font-weight: 400; letter-spacing: 0; }
    .rodape a:hover, .rodape button:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <img src="__CHATWOOT_URL__/brand-assets/logo_dark.svg" alt="BioSaúde">
    <h1 id="titulo">Trocar senha</h1>
    <p id="explica">Escolha uma senha que só você saiba.</p>
  </header>

  <section class="cartao">
    <p class="mensagem" id="mensagem" role="alert"></p>
    <form id="form">
      <input type="text" name="usuario" id="usuario" autocomplete="username" hidden>
      <label>Senha atual
        <input id="atual" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label>Nova senha
        <input id="nova" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      </label>
      <p class="dica">Pelo menos 10 caracteres. Uma frase curta é mais fácil de lembrar e difícil de adivinhar.</p>
      <label>Repita a nova senha
        <input id="repete" type="password" autocomplete="new-password" required>
      </label>
      <button type="submit" id="salvar">Salvar senha</button>
    </form>
    <p class="rodape"><a href="/admin" id="voltar">Voltar para a central</a> · <button type="button" id="sair">Sair</button></p>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    function mensagem(tipo, texto) {
      $("mensagem").className = "mensagem " + tipo;
      $("mensagem").textContent = texto;
    }

    fetch("/admin/api/eu").then((r) => r.status === 401 ? location.href = "/admin/login?volta=/admin/senha" : r.json()).then((eu) => {
      if (!eu || !eu.usuario) return;
      $("usuario").value = eu.usuario;
      if (!eu.cadastrado) {
        mensagem("info", "Este login vem da configuração do servidor. A senha dele muda nas variáveis de ambiente.");
        $("form").hidden = true;
      } else if (eu.trocarSenha) {
        $("titulo").textContent = "Crie a sua senha";
        $("explica").textContent = "Você entrou com uma senha provisória. Troque por uma senha só sua para continuar.";
        $("atual").previousSibling.textContent = "Senha provisória";
        $("voltar").hidden = true;
      }
    }).catch(() => {});

    $("sair").addEventListener("click", () => {
      const form = document.createElement("form");
      form.method = "post";
      form.action = "/admin/logout";
      document.body.append(form);
      form.submit();
    });

    $("form").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      if ($("nova").value !== $("repete").value) {
        mensagem("erro", "As duas senhas novas não são iguais.");
        return;
      }
      $("salvar").disabled = true;
      try {
        const resp = await fetch("/admin/api/senha", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ atual: $("atual").value, nova: $("nova").value })
        });
        if (resp.status === 401) {
          location.href = "/admin/login?volta=/admin/senha";
          return;
        }
        if (!resp.ok) {
          const corpo = await resp.json().catch(() => ({}));
          mensagem("erro", corpo.erro || "Não foi possível trocar a senha.");
          return;
        }
        mensagem("info", "Senha trocada. Abrindo a central...");
        setTimeout(() => location.href = "/admin", 900);
      } catch (e) {
        mensagem("erro", "Sem conexão. Tente de novo.");
      } finally {
        $("salvar").disabled = false;
      }
    });
  </script>
</body>
</html>
