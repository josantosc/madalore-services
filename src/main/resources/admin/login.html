<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar - Central de administração</title>
  <link rel="icon" href="__CHATWOOT_URL__/favicon-32x32.png">
  <style>
    @property --bs-angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    :root { --bs-primary: #0b5c7a; --bs-glow: #12a4a8; --bs-accent: #e53935; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; color: #e6f4f8;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 32px 16px; position: relative; isolation: isolate; overflow: hidden;
      background:
        radial-gradient(60rem 40rem at 10% -10%, color-mix(in srgb, var(--bs-primary) 55%, transparent), transparent 60%),
        radial-gradient(50rem 35rem at 110% 110%, color-mix(in srgb, var(--bs-accent) 30%, transparent), transparent 60%),
        linear-gradient(160deg, #04101a 0%, #0a1f2b 55%, #050d15 100%);
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 70%);
      animation: bs-grid 20s linear infinite;
    }
    body::after {
      content: ""; position: fixed; left: 0; right: 0; top: 58%; height: 120px; z-index: -1;
      background: linear-gradient(90deg, transparent, var(--bs-accent) 30%, var(--bs-glow) 70%, transparent);
      -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='120'><path d='M0 60H220L235 60L245 30L255 95L268 10L282 110L292 60H310L320 48L332 60H600' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/></svg>") 0 0 / 600px 120px repeat-x;
      mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='120'><path d='M0 60H220L235 60L245 30L255 95L268 10L282 110L292 60H310L320 48L332 60H600' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/></svg>") 0 0 / 600px 120px repeat-x;
      filter: drop-shadow(0 0 6px var(--bs-glow)); opacity: .55;
      animation: bs-ecg 6s linear infinite;
    }

    header { text-align: center; display: grid; justify-items: center; gap: 12px; }
    header img { height: 52px; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--bs-glow) 55%, transparent)); animation: bs-pulse 2.4s ease-in-out infinite; }
    h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: .01em;
      background: linear-gradient(90deg, #ffffff, var(--bs-glow)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    header p { margin: -6px 0 0; color: rgba(230, 244, 248, .6); font-size: 14px; }

    .cartao {
      position: relative; width: min(408px, 100%); padding: 36px 34px 32px; border-radius: 22px;
      background: rgba(8, 24, 34, .55); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7), 0 0 60px -10px color-mix(in srgb, var(--bs-primary) 55%, transparent);
      animation: bs-rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    .cartao::before {
      content: ""; position: absolute; inset: -1px; padding: 1px; border-radius: inherit; pointer-events: none;
      background: conic-gradient(from var(--bs-angle), transparent 0 65%, var(--bs-glow) 80%, var(--bs-accent) 90%, transparent);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
      animation: bs-spin 6s linear infinite;
    }
    .cartao.erro { animation: bs-wiggle .4s ease-in-out; }
    form { display: grid; gap: 18px; }
    label { display: grid; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(230, 244, 248, .85); }
    input {
      height: 44px; padding: 0 14px; font: inherit; font-size: 14px; color: #e6f4f8; caret-color: var(--bs-glow);
      background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input::placeholder { color: rgba(230, 244, 248, .35); }
    input:focus { background: rgba(255, 255, 255, .07); border-color: var(--bs-glow);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--bs-glow) 30%, transparent), 0 0 24px color-mix(in srgb, var(--bs-glow) 40%, transparent); }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 1000px #0d2330 inset; -webkit-text-fill-color: #e6f4f8; }
    button {
      position: relative; overflow: hidden; height: 44px; margin-top: 4px; border: 0; border-radius: 12px; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 600; letter-spacing: .03em; color: #fff;
      background: linear-gradient(110deg, var(--bs-primary), var(--bs-glow) 50%, var(--bs-primary)); background-size: 200% 100%;
      box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--bs-glow) 80%, transparent);
      transition: transform .15s, box-shadow .2s, background-position .6s;
    }
    button:hover:not(:disabled) { background-position: 100% 0; transform: translateY(-1px);
      box-shadow: 0 16px 40px -10px color-mix(in srgb, var(--bs-glow) 95%, transparent); }
    button:disabled { opacity: .7; cursor: wait; }
    button::after { content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
      transform: translateX(-100%); animation: bs-shine 3.5s ease-in-out infinite; }
    .mensagem { display: none; margin: 0 0 18px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
    .mensagem.erro { display: block; background: rgba(229, 57, 53, .14); border: 1px solid rgba(229, 57, 53, .35); color: #ffb4b0; }
    .mensagem.info { display: block; background: rgba(18, 164, 168, .12); border: 1px solid rgba(18, 164, 168, .35); color: #a8e6e8; }
    .rodape { margin: 22px 0 0; text-align: center; font-size: 12px; color: rgba(230, 244, 248, .45); }
    .rodape a { color: var(--bs-glow); text-decoration: none; }
    .rodape a:hover { text-decoration: underline; }

    @keyframes bs-grid { to { background-position: 0 48px, 48px 0; } }
    @keyframes bs-ecg { to { -webkit-mask-position: -600px 0; mask-position: -600px 0; } }
    @keyframes bs-spin { to { --bs-angle: 360deg; } }
    @keyframes bs-rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    @keyframes bs-shine { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    @keyframes bs-pulse { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.04); } 24% { transform: scale(1); } 36% { transform: scale(1.03); } }
    @keyframes bs-wiggle { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after, body::before, body::after { animation: none !important; } }
  </style>
</head>
<body>
  <header>
    <img src="__CHATWOOT_URL__/brand-assets/logo_dark.svg" alt="BioSaúde">
    <h1>Central de administração</h1>
    <p>Curadoria, tabela de preços e simulador</p>
  </header>

  <section class="cartao" id="cartao">
    <p class="mensagem" id="mensagem" role="alert"></p>
    <form method="post" action="/admin/login" id="form">
      <input type="hidden" name="volta" id="volta">
      <label>E-mail ou usuário
        <input name="usuario" autocomplete="username" placeholder="seu@email.com" required autofocus>
      </label>
      <label>Senha
        <input name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
      </label>
      <button type="submit" id="entrar">Entrar</button>
    </form>
    <p class="rodape">Esqueceu a senha? Fale com o administrador.<br><a href="__CHATWOOT_URL__/app">Voltar para as conversas</a></p>
  </section>

  <script>
    const MENSAGENS = {
      senha: ["erro", "Usuário ou senha incorretos."],
      bloqueado: ["erro", "Muitas tentativas. Aguarde 15 minutos e tente de novo."],
      saiu: ["info", "Você saiu da central de administração."]
    };
    const params = new URLSearchParams(location.search);
    const chave = params.get("erro") || (params.has("saiu") ? "saiu" : null);
    if (MENSAGENS[chave]) {
      const [tipo, texto] = MENSAGENS[chave];
      const msg = document.getElementById("mensagem");
      msg.className = "mensagem " + tipo;
      msg.textContent = texto;
      if (tipo === "erro") document.getElementById("cartao").classList.add("erro");
      history.replaceState(null, "", location.pathname + (params.get("volta") ? "?volta=" + encodeURIComponent(params.get("volta")) : ""));
    }
    document.getElementById("volta").value = params.get("volta") || "";
    document.getElementById("form").addEventListener("submit", () => {
      const botao = document.getElementById("entrar");
      setTimeout(() => { botao.disabled = true; botao.textContent = "Entrando..."; }, 0);
    });
  </script>
</body>
</html>
