spring.config.activate.on-profile=local-postgres

# Espelho local e reduzido do schema Tasy para desenvolvimento.
tasy.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=tasy_test}
tasy.datasource.username=${POSTGRES_USER:postgres}
tasy.datasource.password=${POSTGRES_PASSWORD:postgres}
tasy.datasource.driver-class-name=org.postgresql.Driver
tasy.datasource.oracle-net-encryption-enabled=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/local-postgres/schema.sql
spring.sql.init.data-locations=classpath:db/local-postgres/data.sql
spring.sql.init.continue-on-error=false

# Observabilidade local no mesmo servidor, isolada no schema observability.
observability.postgres.enabled=${OBSERVABILITY_POSTGRES_ENABLED:true}
observability.postgres.initialize-schema=${OBSERVABILITY_POSTGRES_INITIALIZE_SCHEMA:true}
observability.datasource.url=${OBSERVABILITY_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/postgres}
observability.datasource.username=${OBSERVABILITY_POSTGRES_USER:${POSTGRES_USER:postgres}}
observability.datasource.password=${OBSERVABILITY_POSTGRES_PASSWORD:${POSTGRES_PASSWORD:postgres}}

# Dependências externas não são necessárias para consultar o catálogo local.
agendamento-ds.base-url=${AGENDAMENTO_DS_BASE_URL:http://localhost:7080}
