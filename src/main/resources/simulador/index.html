<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Simulador de conversa</title>
  <link rel="stylesheet" href="/admin/assets/nav.css">
  <script src="/admin/assets/nav.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #eef1f5; color: #1f2933; height: 100vh; display: flex; flex-direction: column; }
    header { background: #075e54; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; flex: 1; }
    header small { opacity: .8; font-family: Consolas, monospace; }
    header button, header select { background: #fff; color: #075e54; border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 600; }
    main { flex: 1; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 440px); min-height: 0; }
    .chat { display: flex; flex-direction: column; min-height: 0; background: #e5ddd5; }
    .mensagens { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 11px; border-radius: 8px; white-space: pre-wrap; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,.12); cursor: default; }
    .msg.usuario { align-self: flex-end; background: #dcf8c6; }
    .msg.bot { align-self: flex-start; background: #fff; cursor: pointer; }
    .msg.bot.selecionada { outline: 2px solid #128c7e; }
    .msg.erro { align-self: center; background: #fde2e1; color: #9b1c1c; font-size: 13px; }
    .msg .meta { display: block; font-size: 11px; color: #667781; margin-top: 4px; }
    .msg.transbordo { border-left: 4px solid #f59e0b; }
    .msg.humano { align-self: flex-start; background: #fff7d6; border-left: 4px solid #f59e0b; }
    .ok { background: #e3f6ec; color: #1e6b43; border-radius: 6px; padding: 8px; }
    .atalhos { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px 0; }
    .atalhos button { background: #fff; border: 1px solid #c8d1d9; border-radius: 14px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    form { display: flex; gap: 8px; padding: 10px 12px 12px; }
    form input { flex: 1; padding: 11px 14px; border-radius: 20px; border: 1px solid #c8d1d9; font-size: 15px; }
    form button { background: #128c7e; color: #fff; border: 0; border-radius: 20px; padding: 0 18px; font-size: 15px; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: wait; }
    form .icone { background: #fff; color: #52606d; border: 1px solid #c8d1d9; width: 44px; padding: 0; display: grid; place-items: center; }
    form .icone:hover { color: #075e54; border-color: #128c7e; }
    form .icone svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .msg img { display: block; max-width: 240px; max-height: 240px; border-radius: 6px; margin-bottom: 4px; }
    .msg a.arquivo { display: block; color: #0b5394; margin-bottom: 4px; }
    dialog.camera { border: 0; border-radius: 12px; padding: 16px; width: min(640px, calc(100vw - 24px)); box-shadow: 0 16px 48px rgba(0,0,0,.25); }
    dialog.camera::backdrop { background: rgba(0,0,0,.5); }
    dialog.camera video { width: 100%; border-radius: 8px; background: #000; display: block; }
    dialog.camera .acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    dialog.camera .acoes button { border: 0; border-radius: 20px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
    dialog.camera .tirar { background: #128c7e; color: #fff; }
    dialog.camera .cancelar { background: #eef1f5; color: #1f2933; }
    aside { background: #fff; border-left: 1px solid #d5dbe1; overflow-y: auto; padding: 14px 16px; font-size: 13px; }
    aside h2 { font-size: 14px; margin: 0 0 10px; }
    aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #52606d; margin: 16px 0 6px; }
    .vazio { color: #7b8794; }
    .linha { display: flex; gap: 8px; margin: 3px 0; }
    .linha b { min-width: 72px; color: #52606d; font-weight: 600; }
    code, pre { font-family: Consolas, monospace; font-size: 12px; }
    pre { background: #f5f7fa; border: 1px solid #e4e7eb; border-radius: 6px; padding: 8px; overflow-x: auto; margin: 0; white-space: pre-wrap; word-break: break-word; }
    .ctx { display: inline-block; background: #e3f2fd; color: #0b5394; border-radius: 10px; padding: 2px 8px; margin: 2px 4px 2px 0; font-family: Consolas, monospace; font-size: 12px; }
    .alerta { background: #fde2e1; color: #9b1c1c; border-radius: 6px; padding: 8px; }
    .aviso { background: #fff4e5; color: #8a4b00; border-radius: 6px; padding: 8px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #d5dbe1; max-height: 40vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Simulador de conversa</h1>
    <small id="sessao"></small>
    <select id="modo" title="Dialogflow direto mostra intents e contextos. Via Chatwoot segue o caminho real, com transbordo para atendente.">
      <option value="dialogflow">Dialogflow direto</option>
      <option value="chatwoot">Via Chatwoot</option>
    </select>
    <button id="nova" type="button" title="Inicia uma sessão nova no Dialogflow, sem contextos">Nova conversa</button>
  </header>
  <main>
    <section class="chat">
      <div class="mensagens" id="mensagens"></div>
      <div class="atalhos" id="atalhos"></div>
      <form id="form" autocomplete="off">
        <button class="icone" id="anexar" type="button" title="Enviar foto ou PDF (o texto digitado vai como legenda)">
          <svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
        <button class="icone" id="camera" type="button" title="Tirar foto com a câmera">
          <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
        <input id="texto" placeholder="Digite como o paciente digitaria" autofocus>
        <button id="enviar" type="submit">Enviar</button>
        <input id="arquivo" type="file" accept="image/*,application/pdf" hidden>
        <input id="arquivo-camera" type="file" accept="image/*" capture="environment" hidden>
      </form>
      <dialog class="camera" id="janela-camera">
        <video id="video" autoplay playsinline muted></video>
        <div class="acoes">
          <button class="cancelar" id="cancelar-camera" type="button">Cancelar</button>
          <button class="tirar" id="tirar-foto" type="button">Tirar foto e enviar</button>
        </div>
      </dialog>
    </section>
    <aside id="detalhe">
      <h2>Detalhes do turno</h2>
      <p class="vazio">Envie uma mensagem. Clique numa resposta do bot para ver a intent, os contextos e os parâmetros daquele turno.</p>
    </aside>
  </main>
  <script>
    const ATALHOS = ["oi", "marcar consulta", "ver meus agendamentos", "começar de novo", "quero falar com atendente"];
    const mensagens = document.getElementById("mensagens");
    const detalhe = document.getElementById("detalhe");
    const form = document.getElementById("form");
    const campo = document.getElementById("texto");
    const botao = document.getElementById("enviar");
    let sessao = sessionStorage.getItem("simulador.sessao") || novaSessao();

    function novaSessao() {
      const id = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("");
      sessionStorage.setItem("simulador.sessao", id);
      return id;
    }

    function mostrarSessao() {
      document.getElementById("sessao").textContent = "sessão " + sessao;
    }

    function hora() {
      return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function adicionar(classe, texto, meta) {
      const div = document.createElement("div");
      div.className = "msg " + classe;
      div.textContent = texto;
      if (meta) {
        const span = document.createElement("span");
        span.className = "meta";
        span.textContent = meta;
        div.appendChild(span);
      }
      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
      return div;
    }

    function el(tag, attrs, ...filhos) {
      const node = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => node[k] = v);
      filhos.flat().forEach((f) => node.append(f));
      return node;
    }

    function linha(rotulo, valor) {
      return el("div", { className: "linha" }, el("b", {}, rotulo), el("code", {}, valor || "-"));
    }

    function mostrarDetalhe(turno, div) {
      document.querySelectorAll(".msg.bot.selecionada").forEach((m) => m.classList.remove("selecionada"));
      div.classList.add("selecionada");
      const r = turno.resposta;
      const contextos = r.contextos.length
        ? r.contextos.map((c) => el("span", { className: "ctx", title: "lifespan " + c.lifespan }, c.nome + " · " + c.lifespan))
        : [el("span", { className: "vazio" }, "nenhum contexto ativo")];
      const parametros = Object.keys(r.parametros || {}).length
        ? el("pre", {}, JSON.stringify(r.parametros, null, 2))
        : el("span", { className: "vazio" }, "nenhum parâmetro");
      detalhe.replaceChildren(
        el("h2", {}, "Turno " + turno.numero + " · " + turno.hora),
        linha("Usuário", turno.texto),
        linha("Intent", r.intent),
        linha("Ação", r.acao),
        linha("Latência", r.latenciaMs + " ms"),
        r.erroWebhook ? el("div", { className: "alerta" }, "Webhook falhou: " + r.erroWebhook) : "",
        r.transbordo ? el("div", { className: "aviso" }, "Transbordo: no Chatwoot esta conversa iria para um atendente.") : "",
        el("h3", {}, "Contextos ativos"),
        el("div", {}, contextos),
        el("h3", {}, "Parâmetros"),
        parametros
      );
    }

    const seletorModo = document.getElementById("modo");
    let modo = sessionStorage.getItem("simulador.modo") || "dialogflow";
    let renderizadas = new Set();
    let consulta = null;

    function comAnexos(div, anexos) {
      [...(anexos || [])].reverse().forEach((a) => {
        const link = el("a", { href: a.url, target: "_blank", rel: "noopener" });
        if (a.tipo === "image") {
          link.append(el("img", { src: a.url, alt: "anexo" }));
        } else {
          link.className = "arquivo";
          link.textContent = "📄 " + decodeURIComponent(a.url.split("?")[0].split("/").pop() || "arquivo");
        }
        div.prepend(link);
      });
    }

    function mostrarConversa(c) {
      (c.mensagens || []).forEach((m) => {
        if (renderizadas.has(m.id)) return;
        renderizadas.add(m.id);
        let div;
        if (m.doPaciente) {
          div = adicionar("usuario", m.texto, "paciente");
        } else if (m.tipoRemetente === "agent_bot") {
          div = adicionar("bot", m.texto, m.remetente + " · bot");
        } else {
          div = adicionar("humano", m.texto, m.remetente + " · atendente");
        }
        comAnexos(div, m.anexos);
        mensagens.scrollTop = mensagens.scrollHeight;
      });
      const situacao = c.emAtendimento
        ? el("div", { className: "aviso" }, "Em atendimento humano. O bot parou de responder; o atendente responde pelo painel do Chatwoot e a mensagem aparece aqui.")
        : el("div", { className: "ok" }, c.conversationId ? "Bot atendendo (status " + (c.status || "-") + ")." : "Envie uma mensagem para abrir a conversa no Chatwoot.");
      const painel = c.painelUrl
        ? el("a", { href: c.painelUrl, target: "_blank", rel: "noopener" }, "Abrir conversa no painel do Chatwoot")
        : "";
      detalhe.replaceChildren(
        el("h2", {}, "Conversa no Chatwoot"),
        linha("Conversa", c.conversationId),
        linha("Status", c.status),
        situacao,
        el("p", {}, painel),
        el("p", { className: "vazio" }, "Neste modo a mensagem segue o caminho real: Chatwoot, webhook do Mandalore e Dialogflow. Intents e contextos ficam no log do Mandalore.")
      );
    }

    async function lerConversa() {
      try {
        const resp = await fetch("/simulador/chatwoot/conversa?sessao=" + encodeURIComponent(sessao));
        if (resp.ok) mostrarConversa(await resp.json());
      } catch (e) {
        // a próxima consulta tenta de novo
      }
    }

    function consultarPeriodicamente() {
      if (consulta) return;
      consulta = setInterval(lerConversa, 2000);
    }

    function pararConsulta() {
      clearInterval(consulta);
      consulta = null;
    }

    async function enviarChatwoot(texto) {
      campo.value = "";
      botao.disabled = true;
      try {
        const resp = await fetch("/simulador/chatwoot/mensagem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessao, texto })
        });
        const corpo = await resp.json();
        if (!resp.ok) {
          adicionar("erro", corpo.erro || ("HTTP " + resp.status));
          return;
        }
        mostrarConversa(corpo);
        consultarPeriodicamente();
      } catch (e) {
        adicionar("erro", "Não foi possível falar com o Mandalore: " + e.message);
      } finally {
        botao.disabled = false;
        campo.focus();
      }
    }

    let numero = 0;
    async function enviar(texto) {
      texto = texto.trim();
      if (!texto) return;
      if (modo === "chatwoot") return enviarChatwoot(texto);
      adicionar("usuario", texto, hora());
      campo.value = "";
      botao.disabled = true;
      try {
        const resp = await fetch("/simulador/mensagem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessao, texto })
        });
        const corpo = await resp.json();
        if (!resp.ok) {
          adicionar("erro", corpo.erro || ("HTTP " + resp.status));
          return;
        }
        numero += 1;
        const turno = { numero, texto, hora: hora(), resposta: corpo };
        const div = adicionar("bot" + (corpo.transbordo ? " transbordo" : ""), corpo.texto || "(sem resposta)", corpo.intent + " · " + corpo.latenciaMs + " ms");
        div.addEventListener("click", () => mostrarDetalhe(turno, div));
        mostrarDetalhe(turno, div);
      } catch (e) {
        adicionar("erro", "Não foi possível falar com o Mandalore: " + e.message);
      } finally {
        botao.disabled = false;
        campo.focus();
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); enviar(campo.value); });

    function exigirModoChatwoot() {
      if (modo === "chatwoot") return;
      seletorModo.value = "chatwoot";
      seletorModo.dispatchEvent(new Event("change"));
      adicionar("erro", "Arquivos seguem o caminho real: o simulador passou para o modo Via Chatwoot.");
    }

    async function enviarArquivo(arquivo) {
      exigirModoChatwoot();
      if (arquivo.size > 10 * 1048576) {
        adicionar("erro", "Arquivo acima de 10 MB.");
        return;
      }
      const dados = new FormData();
      dados.append("sessao", sessao);
      dados.append("arquivo", arquivo, arquivo.name);
      dados.append("texto", campo.value.trim());
      campo.value = "";
      botao.disabled = true;
      const enviando = adicionar("usuario", "Enviando " + arquivo.name + "…", hora());
      try {
        const resp = await fetch("/simulador/chatwoot/arquivo", { method: "POST", body: dados });
        const corpo = await resp.json().catch(() => ({}));
        enviando.remove();
        if (!resp.ok) {
          adicionar("erro", corpo.erro || ("HTTP " + resp.status));
          return;
        }
        mostrarConversa(corpo);
        consultarPeriodicamente();
      } catch (e) {
        enviando.remove();
        adicionar("erro", "Não foi possível falar com o Mandalore: " + e.message);
      } finally {
        botao.disabled = false;
        campo.focus();
      }
    }

    const seletorArquivo = document.getElementById("arquivo");
    const seletorCamera = document.getElementById("arquivo-camera");
    [seletorArquivo, seletorCamera].forEach((input) => input.addEventListener("change", () => {
      if (input.files[0]) enviarArquivo(input.files[0]);
      input.value = "";
    }));
    document.getElementById("anexar").addEventListener("click", () => seletorArquivo.click());

    const janelaCamera = document.getElementById("janela-camera");
    const video = document.getElementById("video");
    let fluxo = null;

    function fecharCamera() {
      if (fluxo) fluxo.getTracks().forEach((t) => t.stop());
      fluxo = null;
      if (janelaCamera.open) janelaCamera.close();
    }

    document.getElementById("camera").addEventListener("click", async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        seletorCamera.click();
        return;
      }
      try {
        fluxo = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = fluxo;
        janelaCamera.showModal();
      } catch (e) {
        adicionar("erro", "Câmera indisponível (" + e.name + "). Escolha uma foto do aparelho.");
        seletorCamera.click();
      }
    });
    document.getElementById("cancelar-camera").addEventListener("click", fecharCamera);
    janelaCamera.addEventListener("close", fecharCamera);
    document.getElementById("tirar-foto").addEventListener("click", () => {
      if (!video.videoWidth) return;
      const tela = document.createElement("canvas");
      tela.width = video.videoWidth;
      tela.height = video.videoHeight;
      tela.getContext("2d").drawImage(video, 0, 0);
      tela.toBlob((blob) => {
        fecharCamera();
        if (blob) enviarArquivo(new File([blob], "foto-" + Date.now() + ".jpg", { type: "image/jpeg" }));
      }, "image/jpeg", 0.9);
    });
    function reiniciar(mensagem) {
      pararConsulta();
      sessao = novaSessao();
      numero = 0;
      renderizadas = new Set();
      mensagens.replaceChildren();
      if (modo === "chatwoot") {
        mostrarConversa({ mensagens: [] });
      } else {
        detalhe.replaceChildren(el("h2", {}, "Detalhes do turno"), el("p", { className: "vazio" }, mensagem));
      }
      mostrarSessao();
      campo.focus();
    }

    document.getElementById("nova").addEventListener("click", () => reiniciar("Conversa nova iniciada."));
    seletorModo.value = modo;
    seletorModo.addEventListener("change", () => {
      modo = seletorModo.value;
      sessionStorage.setItem("simulador.modo", modo);
      reiniciar("Modo Dialogflow direto.");
    });
    if (modo === "chatwoot") {
      mostrarConversa({ mensagens: [] });
      lerConversa().then(() => { if (renderizadas.size) consultarPeriodicamente(); });
    }
    ATALHOS.forEach((t) => {
      document.getElementById("atalhos").append(el("button", { type: "button", onclick: () => enviar(t) }, t));
    });
    mostrarSessao();
  </script>
</body>
</html>
